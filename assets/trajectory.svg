<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" role="img" aria-label="Career trajectory for Amirreza Kamali"><defs><linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b625b"/><stop offset=".55" stop-color="#0c3b3d"/><stop offset="1" stop-color="#2d4f88"/></linearGradient><linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43ead3" stop-opacity="0"/><stop offset=".5" stop-color="#43ead3" stop-opacity=".55"/><stop offset="1" stop-color="#43ead3" stop-opacity="0"/></linearGradient><radialGradient id="aura"><stop stop-color="#43ead3" stop-opacity=".2"/><stop offset="1" stop-color="#43ead3" stop-opacity="0"/></radialGradient><!-- Career trajectory for Amirreza Kamali --><style>.title{font:700 22px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#dcfff7}.display{font:700 28px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#dcfff7}.label{font:700 9px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#43ead3;letter-spacing:1.6px}.sub{font:700 9px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#79aaa4;letter-spacing:1.4px}.body{font:11px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#79aaa4}.mono{font:10px ui-monospace,Consolas,monospace;fill:#79aaa4}.chip{font:700 8px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#dcfff7}.rise{animation:rise .6s cubic-bezier(.32,.72,0,1) both}.fade{animation:fade .7s ease both}.bar{transform-origin:left;animation:grow .9s cubic-bezier(.32,.72,0,1) both}.pulse{animation:pulse 3.2s ease-in-out infinite}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.role{font:700 13px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#dcfff7}</style></defs><rect width="900" height="470" rx="24" fill="#0b1d20"/><rect x="6" y="6" width="888" height="458" rx="20" fill="url(#shell)" stroke="#168f82"/><rect x="22" y="22" width="856" height="426" rx="18" fill="#0a2928" stroke="#1ca596"/><text x="46" y="58" class="title">Trajectory</text><text x="47" y="76" class="label">ROLES · BANKING, PRODUCT AND HARDWARE ENGINEERING</text><rect x="46" y="86" width="808" height="1" fill="url(#sheen)"/><text x="854" y="56" text-anchor="end" class="label">&gt; CAREER.LOG</text><path d="M64 114V386" stroke="#1ca596" stroke-opacity=".4" stroke-dasharray="3 6"/><g class="rise" style="animation-delay:0.00s"><circle cx="64" cy="122" r="9" fill="#0b2227" stroke="#43ead3" stroke-width="2"/><circle cx="64" cy="122" r="3.5" fill="#43ead3"/><text x="92" y="120" class="role">Freelance Software Developer<tspan fill="#43ead3"> @ Self-employed</tspan></text><text x="854" y="120" text-anchor="end" class="mono" fill="#43ead3">JUL 2024 — PRESENT</text><text x="92" y="137" class="body">Backend &amp; full-stack delivery for clients incl. Snapp and Blu Bank; AI integration and agent systems.</text><g transform="translate(92.0 145.0)"><rect width="42.2" height="17" rx="8.5" fill="#0d3636" stroke="#43ead3" stroke-opacity=".55"/><text x="21.1" y="12" text-anchor="middle" class="chip">Python</text></g><g transform="translate(140.2 145.0)"><rect width="55.2" height="17" rx="8.5" fill="#0d3636" stroke="#43ead3" stroke-opacity=".55"/><text x="27.6" y="12" text-anchor="middle" class="chip">AI Agents</text></g><g transform="translate(201.4 145.0)"><rect width="59.6" height="17" rx="8.5" fill="#0d3636" stroke="#43ead3" stroke-opacity=".55"/><text x="29.8" y="12" text-anchor="middle" class="chip">Automation</text></g></g><g class="rise" style="animation-delay:0.10s"><circle cx="64" cy="188" r="9" fill="#0b2227" stroke="#9b6cff" stroke-width="2"/><circle cx="64" cy="188" r="3.5" fill="#9b6cff"/><text x="92" y="186" class="role">Backend Developer (Python/Django)<tspan fill="#9b6cff"> @ Mayatek</tspan></text><text x="854" y="186" text-anchor="end" class="mono" fill="#9b6cff">JUL 2024 — PRESENT</text><text x="92" y="203" class="body">Backend architecture and REST APIs for scalable web apps; database design and optimization.</text><g transform="translate(92.0 211.0)"><rect width="42.2" height="17" rx="8.5" fill="#0d3636" stroke="#9b6cff" stroke-opacity=".55"/><text x="21.1" y="12" text-anchor="middle" class="chip">Django</text></g><g transform="translate(140.2 211.0)"><rect width="29.1" height="17" rx="8.5" fill="#0d3636" stroke="#9b6cff" stroke-opacity=".55"/><text x="14.5" y="12" text-anchor="middle" class="chip">DRF</text></g><g transform="translate(175.2 211.0)"><rect width="59.6" height="17" rx="8.5" fill="#0d3636" stroke="#9b6cff" stroke-opacity=".55"/><text x="29.8" y="12" text-anchor="middle" class="chip">PostgreSQL</text></g></g><g class="rise" style="animation-delay:0.20s"><circle cx="64" cy="254" r="9" fill="#0b2227" stroke="#ff6b48" stroke-width="2"/><circle cx="64" cy="254" r="3.5" fill="#ff6b48"/><text x="92" y="252" class="role">FPGA Design Intern<tspan fill="#ff6b48"> @ Pajoohesh Novin Rayaneh (PNR)</tspan></text><text x="854" y="252" text-anchor="end" class="mono" fill="#ff6b48">JUL 2024 — OCT 2024</text><text x="92" y="269" class="body">Digital design on programmable hardware: counters, ALUs and memory blocks in VHDL.</text><g transform="translate(92.0 277.0)"><rect width="33.4" height="17" rx="8.5" fill="#0d3636" stroke="#ff6b48" stroke-opacity=".55"/><text x="16.7" y="12" text-anchor="middle" class="chip">VHDL</text></g><g transform="translate(131.4 277.0)"><rect width="59.6" height="17" rx="8.5" fill="#0d3636" stroke="#ff6b48" stroke-opacity=".55"/><text x="29.8" y="12" text-anchor="middle" class="chip">Xilinx ISE</text></g><g transform="translate(197.0 277.0)"><rect width="42.2" height="17" rx="8.5" fill="#0d3636" stroke="#ff6b48" stroke-opacity=".55"/><text x="21.1" y="12" text-anchor="middle" class="chip">Vivado</text></g></g><g class="rise" style="animation-delay:0.30s"><circle cx="64" cy="320" r="9" fill="#0b2227" stroke="#4387ff" stroke-width="2"/><circle cx="64" cy="320" r="3.5" fill="#4387ff"/><text x="92" y="318" class="role">Backend Developer (Python)<tspan fill="#4387ff"> @ Dotin</tspan></text><text x="854" y="318" text-anchor="end" class="mono" fill="#4387ff">JAN 2024 — JUN 2024</text><text x="92" y="335" class="body">Enterprise banking services, secure API integrations and PostgreSQL query tuning.</text><g transform="translate(92.0 343.0)"><rect width="33.4" height="17" rx="8.5" fill="#0d3636" stroke="#4387ff" stroke-opacity=".55"/><text x="16.7" y="12" text-anchor="middle" class="chip">REST</text></g><g transform="translate(131.4 343.0)"><rect width="59.6" height="17" rx="8.5" fill="#0d3636" stroke="#4387ff" stroke-opacity=".55"/><text x="29.8" y="12" text-anchor="middle" class="chip">PostgreSQL</text></g><g transform="translate(197.0 343.0)"><rect width="46.5" height="17" rx="8.5" fill="#0d3636" stroke="#4387ff" stroke-opacity=".55"/><text x="23.3" y="12" text-anchor="middle" class="chip">Testing</text></g></g><g class="rise" style="animation-delay:0.40s"><circle cx="64" cy="386" r="9" fill="#0b2227" stroke="#32d8ef" stroke-width="2"/><circle cx="64" cy="386" r="3.5" fill="#32d8ef"/><text x="92" y="384" class="role">Software Engineer Intern<tspan fill="#32d8ef"> @ Tosan Techno</tspan></text><text x="854" y="384" text-anchor="end" class="mono" fill="#32d8ef">SEP 2023 — DEC 2023</text><text x="92" y="401" class="body">Internal banking software with Python and SQL; unit tests, Docker and CI/CD in an Agile team.</text><g transform="translate(92.0 409.0)"><rect width="42.2" height="17" rx="8.5" fill="#0d3636" stroke="#32d8ef" stroke-opacity=".55"/><text x="21.1" y="12" text-anchor="middle" class="chip">Python</text></g><g transform="translate(140.2 409.0)"><rect width="29.1" height="17" rx="8.5" fill="#0d3636" stroke="#32d8ef" stroke-opacity=".55"/><text x="14.5" y="12" text-anchor="middle" class="chip">SQL</text></g><g transform="translate(175.2 409.0)"><rect width="37.8" height="17" rx="8.5" fill="#0d3636" stroke="#32d8ef" stroke-opacity=".55"/><text x="18.9" y="12" text-anchor="middle" class="chip">CI/CD</text></g></g></svg>